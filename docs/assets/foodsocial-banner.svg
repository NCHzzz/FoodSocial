<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FoodSocial banner</title>
  <desc id="desc">A warm gradient banner for FoodSocial, an AI-native food discovery platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="0.38" stop-color="#FFE4D6"/>
      <stop offset="0.72" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 90) rotate(120) scale(360 260)">
      <stop offset="0" stop-color="#FDBA74" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FDBA74" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7C2D12" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="42" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="42" fill="url(#sun)"/>

  <g opacity="0.42">
    <circle cx="111" cy="79" r="5" fill="#FB923C"/>
    <circle cx="186" cy="334" r="7" fill="#F97316"/>
    <circle cx="1104" cy="322" r="6" fill="#06B6D4"/>
    <circle cx="1185" cy="86" r="8" fill="#6366F1"/>
    <circle cx="934" cy="352" r="4" fill="#22C55E"/>
    <path d="M56 267C113 225 162 228 207 275C246 316 298 327 360 296" stroke="#FED7AA" stroke-width="12" stroke-linecap="round"/>
    <path d="M940 69C999 31 1056 37 1109 86C1150 124 1190 132 1230 107" stroke="#C7D2FE" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="76" y="70" width="1128" height="280" rx="36" fill="white" fill-opacity="0.78"/>
    <rect x="76.75" y="70.75" width="1126.5" height="278.5" rx="35.25" stroke="white" stroke-opacity="0.9" stroke-width="1.5"/>
  </g>

  <g transform="translate(122 116)">
    <rect x="0" y="0" width="155" height="155" rx="38" fill="#FFEDD5"/>
    <rect x="14" y="14" width="127" height="127" rx="30" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
    <circle cx="78" cy="78" r="43" fill="#F97316"/>
    <circle cx="78" cy="78" r="30" fill="#FDBA74"/>
    <path d="M51 73C61 82 71 87 82 87C95 87 105 80 113 68" stroke="#7C2D12" stroke-width="7" stroke-linecap="round"/>
    <path d="M41 34V119" stroke="#7C2D12" stroke-width="7" stroke-linecap="round"/>
    <path d="M113 34V119" stroke="#7C2D12" stroke-width="7" stroke-linecap="round"/>
    <path d="M113 34C128 51 128 70 113 88" stroke="#7C2D12" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(326 104)">
    <text x="0" y="54" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="800" letter-spacing="-2.5">FoodSocial</text>
    <text x="2" y="100" fill="#7C2D12" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650">AI-native food discovery for Vietnam-first social eating</text>
    <text x="2" y="143" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="450">Share food stories · discover dishes and places · decide what to eat next</text>

    <g transform="translate(0 180)">
      <rect x="0" y="0" width="132" height="38" rx="19" fill="#FFEDD5"/>
      <text x="20" y="25" fill="#9A3412" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">Food-first</text>
      <rect x="148" y="0" width="132" height="38" rx="19" fill="#EEF2FF"/>
      <text x="168" y="25" fill="#4338CA" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">AI-native</text>
      <rect x="296" y="0" width="174" height="38" rx="19" fill="#ECFEFF"/>
<text x="316" y="25" fill="#0E7490" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">Product baseline</text>
    </g>
