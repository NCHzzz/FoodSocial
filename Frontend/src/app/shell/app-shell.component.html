<div class="min-h-dvh bg-[#f5f4ed] text-[#141413]">
  <header class="border-b border-[#f0eee6]/80 bg-[#f5f4ed]/90 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-4 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">
      <div class="flex items-start gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#c96442] font-serif text-lg font-semibold text-[#faf9f5] shadow-[0_0_0_1px_#c96442]">
          FS
        </div>
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.24em] text-[#c96442]">Food-first social</p>
          <a class="inline-flex items-center font-serif text-2xl font-semibold tracking-tight text-[#141413] sm:text-3xl" routerLink="/discover">
            FoodSocial
          </a>
          <p class="mt-1 max-w-xl text-sm text-[#5e5d59] sm:text-base">
            Discover dishes and places worth trying. Sign in when you want to save, follow, and share your own picks.
          </p>
        </div>
      </div>

      <nav aria-label="Primary" class="flex flex-wrap gap-2">
        @for (item of navigationItems(); track item.route) {
          <a
            appShellNavLink
            [routerLink]="item.route"
            routerLinkActive="border-[#141413] bg-[#141413] text-[#faf9f5] shadow-[#c2c0b6]"
            [textContent]="item.label"
          ></a>
        }
      </nav>

      <div class="flex flex-col items-stretch gap-3 sm:flex-row sm:items-center sm:justify-end">
        <div appUiSurface="soft" appUiSurfacePadding="compact">
          <p class="text-xs font-semibold uppercase tracking-[0.22em] text-[#87867f]">Account</p>
          <p class="mt-1 text-sm font-medium text-[#141413]">
            @if (isAuthenticated()) {
              <span [textContent]="session()?.user?.preferredUsername || session()?.user?.email || 'Signed in'"></span>
            } @else {
              Guest browser
            }
          </p>
          <p class="mt-1 text-xs text-[#87867f]" aria-live="polite" [textContent]="sessionSummary()"></p>
        </div>

        @if (isAuthenticated()) {
          <button appUiButton="secondary" type="button" (click)="submitLogout()">
            <span [textContent]="authState().isLoggingOut ? 'Logging out…' : 'Log out'"></span>
          </button>
        } @else {
          <button appUiButton="accent" type="button" (click)="startLogin()">
            Log in
          </button>
        }
      </div>
    </div>
  </header>

  <main class="mx-auto flex max-w-6xl flex-col px-4 py-8 sm:px-6 lg:px-8 lg:py-12">
    <router-outlet />
  </main>
</div>
