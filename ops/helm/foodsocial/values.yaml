global:
  imageRegistry: ghcr.io
  imageRepository: OWNER/foodsocial
  imageTag: REPLACE_WITH_IMMUTABLE_RELEASE_TAG
  imagePullPolicy: IfNotPresent
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4317

commonEnv:
  ASPNETCORE_URLS: http://+:8080
  ServiceDefaults__ExposeHealthEndpoints: "true"
  Identity__ApplyMigrationsOnStartup: "false"
  UserProfile__ApplyMigrationsOnStartup: "false"
  Dish__ApplyMigrationsOnStartup: "false"
  Place__ApplyMigrationsOnStartup: "false"
  Post__ApplyMigrationsOnStartup: "false"

services:
  api-gateway:
    enabled: true
    image: api-gateway
    replicas: 2
    port: 8080
    env:
      Gateway__Clusters__Bff__Address: http://foodsocial-bff
      Gateway__Cors__AllowedOrigins__0: https://foodsocial.example.com
      Gateway__Health__BffTimeoutSeconds: "3"
      Gateway__MaxRequestBodySizeBytes: "26214400"
      Gateway__Proxy__ActivityTimeoutSeconds: "30"
      Gateway__RateLimiting__Default__PermitLimit: "300"
      Gateway__RateLimiting__Default__WindowSeconds: "60"
      Gateway__RateLimiting__Auth__PermitLimit: "30"
      Gateway__RateLimiting__Auth__WindowSeconds: "60"
      Gateway__RateLimiting__RiskyWrite__PermitLimit: "60"
      Gateway__RateLimiting__RiskyWrite__WindowSeconds: "60"
      Gateway__RateLimiting__MediaUpload__PermitLimit: "20"
      Gateway__RateLimiting__MediaUpload__WindowSeconds: "60"
      ForwardedHeaders__KnownNetworks__0: 10.0.0.0/8
  bff:
    enabled: true
    image: bff
    replicas: 2
    port: 8080
    env:
      Bff__DataProtection__KeyRingPath: /app/App_Data/data-protection-keys
  identity-api:
    enabled: true
    image: identity-api
    replicas: 2
    port: 8080
    env: {}
  userprofile-api:
    enabled: true
    image: userprofile-api
    replicas: 2
    port: 8080
    env: {}
  dish-api:
    enabled: true
    image: dish-api
    replicas: 1
    port: 8080
    env: {}
  place-api:
    enabled: true
    image: place-api
    replicas: 1
    port: 8080
    env: {}
  post-api:
    enabled: true
    image: post-api
    replicas: 1
    port: 8080
    env:
      Post__Media__StoragePath: /app/App_Data/media
  web:
    enabled: true
    image: web
    replicas: 2
    port: 8080
    env: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []

mediaStorage:
  postApi:
    mountPath: /app/App_Data/media
    persistentVolumeClaim:
      enabled: true
      existingClaim: ""
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi

dataProtection:
  bff:
    mountPath: /app/App_Data/data-protection-keys
    persistentVolumeClaim:
      enabled: true
      existingClaim: ""
      storageClassName: ""
      accessModes:
        - ReadWriteMany
      size: 1Gi
