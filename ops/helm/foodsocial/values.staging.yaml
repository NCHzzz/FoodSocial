global:
  imageRegistry: ghcr.io
  imageRepository: OWNER/foodsocial
  imageTag: staging
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4317

services:
  api-gateway:
    replicas: 1
    env:
      Gateway__Cors__AllowedOrigins__0: https://staging.foodsocial.example.com
      ForwardedHeaders__KnownNetworks__0: 10.0.0.0/8
  bff:
    replicas: 1
  identity-api:
    replicas: 1
  userprofile-api:
    replicas: 1
  dish-api:
    replicas: 1
  place-api:
    replicas: 1
  post-api:
    replicas: 1
  web:
    replicas: 1
