{{- $postApiService := index .Values.services "post-api" }}
{{- $postMedia := .Values.mediaStorage.postApi }}
{{- if and $postApiService.enabled $postMedia.persistentVolumeClaim.enabled (not $postMedia.persistentVolumeClaim.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foodsocial-post-api-media
  labels:
    {{ include "foodsocial.labels" . | nindent 4 }}
    app.kubernetes.io/name: foodsocial-post-api-media
spec:
  accessModes:
    {{ toYaml $postMedia.persistentVolumeClaim.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $postMedia.persistentVolumeClaim.size | quote }}
  {{- if $postMedia.persistentVolumeClaim.storageClassName }}
  storageClassName: {{ $postMedia.persistentVolumeClaim.storageClassName | quote }}
  {{- end }}
{{- end }}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodsocial-{{ $name }}
  labels:
    {{ include "foodsocial.labels" $ | nindent 4 }}
    app.kubernetes.io/name: foodsocial-{{ $name }}
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: foodsocial-{{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{ include "foodsocial.labels" $ | nindent 8 }}
        app.kubernetes.io/name: foodsocial-{{ $name }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "foodsocial.serviceImage" (dict "root" $ "service" $service) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.global.otlpEndpoint | quote }}
            {{- range $envName, $envValue := $.Values.commonEnv }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
            {{- range $envName, $envValue := $service.env }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /alive
              port: http
            failureThreshold: {{ $.Values.probes.startup.failureThreshold }}
            periodSeconds: {{ $.Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $name "post-api" }}
            - name: post-media
              mountPath: {{ $.Values.mediaStorage.postApi.mountPath }}
            {{- end }}
          resources:
            {{ toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $name "post-api" }}
        - name: post-media
          {{ if $.Values.mediaStorage.postApi.persistentVolumeClaim.enabled }}
          persistentVolumeClaim:
            claimName: {{ default "foodsocial-post-api-media" $.Values.mediaStorage.postApi.persistentVolumeClaim.existingClaim }}
          {{ else }}
          emptyDir: {}
          {{ end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: foodsocial-{{ $name }}
  labels:
    {{ include "foodsocial.labels" $ | nindent 4 }}
    app.kubernetes.io/name: foodsocial-{{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foodsocial-{{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
{{- end }}
