groups:
  - name: foodsocial-service-health
    interval: 30s
    rules:
      - alert: FoodSocialServiceTargetDown
        expr: up{stack="foodsocial"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "FoodSocial telemetry target is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} / {{ $labels.instance }} for more than 2 minutes."

      - alert: FoodSocialHighHttpServerErrorRate
        expr: |
          (
            sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx rate for {{ $labels.job }}"
          description: "More than 5% of HTTP server requests have returned 5xx responses over the last 5 minutes."

      - alert: FoodSocialHighHttpServerLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, le) (rate(http_server_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP p95 latency for {{ $labels.job }}"
          description: "HTTP server p95 latency has exceeded 1 second for more than 5 minutes."
