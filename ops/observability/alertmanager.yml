global:
  resolve_timeout: 5m

route:
  receiver: default-local
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-ops
      repeat_interval: 1h

receivers:
  - name: default-local
    webhook_configs: []
  - name: critical-ops
    webhook_configs: []

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - job
