name: CI

on:
  workflow_dispatch:
    inputs:
      run-apphost-tests:
        description: Run container-backed AppHost integration tests. Requires Docker on the runner.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ops-assets:
    name: Ops asset validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install ops validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Validate ops YAML and JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          yaml_paths = [
              path
              for path in sorted(Path("ops").rglob("*.yml")) + sorted(Path("ops").rglob("*.yaml"))
              if "templates" not in path.parts
          ]
          json_paths = sorted(Path("ops").rglob("*.json"))

          if not yaml_paths and not json_paths:
              raise SystemExit("No ops JSON/YAML assets found to validate.")

          for path in yaml_paths:
              with path.open("r", encoding="utf-8") as stream:
                  documents = list(yaml.safe_load_all(stream))
              if not documents:
                  raise SystemExit(f"{path} did not contain any YAML documents.")
              print(f"validated YAML: {path}")

          for path in json_paths:
              with path.open("r", encoding="utf-8") as stream:
                  json.load(stream)
              print(f"validated JSON: {path}")
          PY

      - name: Validate Helm chart
        run: |
          helm lint ops/helm/foodsocial
          helm template foodsocial ops/helm/foodsocial --values ops/helm/foodsocial/values.staging.yaml >/tmp/foodsocial-staging.yaml
          helm template foodsocial ops/helm/foodsocial --values ops/helm/foodsocial/values.production.yaml >/tmp/foodsocial-production.yaml

  backend:
    name: Backend restore, build, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore Backend/FoodSocial.slnx

      - name: Build backend
        run: dotnet build Backend/FoodSocial.slnx --configuration Release --no-restore

      - name: Test backend unit/API projects
        run: |
          dotnet test Backend/tests/FoodSocial.Bff.Tests/FoodSocial.Bff.Tests.csproj --configuration Release --no-restore
          dotnet test Backend/tests/Identity/Domain.Tests/FoodSocial.Identity.Domain.Tests.csproj --configuration Release --no-restore
          dotnet test Backend/tests/Identity/Application.Tests/FoodSocial.Identity.Application.Tests.csproj --configuration Release --no-restore
          dotnet test Backend/tests/Identity/Api.Tests/FoodSocial.Identity.Api.Tests.csproj --configuration Release --no-restore
          dotnet test Backend/tests/UserProfile/Api.Tests/FoodSocial.UserProfile.Api.Tests.csproj --configuration Release --no-restore
          dotnet test Backend/tests/Dish/Api.Tests/FoodSocial.Dish.Api.Tests.csproj --configuration Release --no-restore
          dotnet test Backend/tests/Place/Api.Tests/FoodSocial.Place.Api.Tests.csproj --configuration Release --no-restore
          dotnet test Backend/tests/Post/Api.Tests/FoodSocial.Post.Api.Tests.csproj --configuration Release --no-restore

  frontend:
    name: Frontend install, test, and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

  container-build:
    name: Container build validation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: foodsocial-bff
            context: Backend
            dockerfile: Backend/src/FoodSocial.Bff/Dockerfile
          - image: foodsocial-identity-api
            context: Backend
            dockerfile: Backend/src/Identity/Api/Dockerfile
          - image: foodsocial-userprofile-api
            context: Backend
            dockerfile: Backend/src/UserProfile/Api/Dockerfile
          - image: foodsocial-dish-api
            context: Backend
            dockerfile: Backend/src/Dish/Api/Dockerfile
          - image: foodsocial-post-api
            context: Backend
            dockerfile: Backend/src/Post/Api/Dockerfile
          - image: foodsocial-web
            context: Frontend
            dockerfile: Frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}:ci" "${{ matrix.context }}"

  apphost-integration:
    name: AppHost container-backed integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs['run-apphost-tests'] == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker is available
        run: |
          docker version
          docker info

      - name: Restore backend
        run: dotnet restore Backend/FoodSocial.slnx

      - name: Build AppHost
        run: dotnet build Backend/src/FoodSocial.AppHost/FoodSocial.AppHost.csproj --configuration Release --no-restore

      - name: Run AppHost-backed tests
        run: dotnet test Backend/tests/FoodSocial.AppHost.Tests/FoodSocial.AppHost.Tests.csproj --configuration Release --no-restore
