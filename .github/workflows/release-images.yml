name: Release Images

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to publish. Defaults to the current commit SHA.
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/foodsocial

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bff
            context: Backend
            dockerfile: Backend/src/FoodSocial.Bff/Dockerfile
          - image: identity-api
            context: Backend
            dockerfile: Backend/src/Identity/Api/Dockerfile
          - image: userprofile-api
            context: Backend
            dockerfile: Backend/src/UserProfile/Api/Dockerfile
          - image: dish-api
            context: Backend
            dockerfile: Backend/src/Dish/Api/Dockerfile
          - image: place-api
            context: Backend
            dockerfile: Backend/src/Place/Api/Dockerfile
          - image: post-api
            context: Backend
            dockerfile: Backend/src/Post/Api/Dockerfile
          - image: web
            context: Frontend
            dockerfile: Frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs['image-tag'] }}" ]; then
            echo "value=${{ inputs['image-tag'] }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=foodsocial-${{ matrix.image }}
